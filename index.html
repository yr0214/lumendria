<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아에르돈의 계약 — 저주를 끊을 자</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="vignette" aria-hidden="true"></div>

    <!-- 타이틀 화면 -->
    <div id="screen-title" class="screen active">
        <div class="title-wrap">
            <div class="kicker">INTERACTIVE FICTION</div>
            <h1 class="title">아에르돈의 계약</h1>
            <div class="title-sub">저주를 끊을 자</div>
            <p class="title-desc">동생은 3년 전 이 왕국에서 죽었다.<br>복수인지 진실인지, 당신조차 아직 모른다.</p>
            <button class="btn-cta" onclick="startGame()">여정을 시작한다</button>
            <p class="title-hint">선택은 마우스 또는 <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> 키로</p>
        </div>
    </div>

    <!-- 게임 화면 -->
    <div id="screen-game" class="screen">
        <div class="stage">
            <!-- 흔적: 획득한 상태 -->
            <header class="trace is-empty" id="trace" aria-label="지금까지의 흔적"></header>

            <!-- 장면 이미지 (없는 노드에서는 접힘) -->
            <section class="scene is-empty" id="scene-area">
                <div class="scene-frame" id="scene-image">
                    <div class="scene-vignette" aria-hidden="true"></div>
                    <div class="scene-controls hidden" id="scene-image-controls">
                        <button class="scene-nav" id="scene-image-prev" type="button" aria-label="이전 그림">&#8249;</button>
                        <span class="scene-counter" id="scene-image-counter"></span>
                        <button class="scene-nav" id="scene-image-next" type="button" aria-label="다음 그림">&#8250;</button>
                    </div>
                </div>
            </section>

            <!-- 스토리 -->
            <section class="story">
                <div class="story-text" id="story-text"></div>
            </section>

            <!-- 선택지 -->
            <nav class="choices" id="choices-area" aria-label="선택지"></nav>
        </div>
    </div>

    <script src="./game.js"></script>
</body>
</html>
